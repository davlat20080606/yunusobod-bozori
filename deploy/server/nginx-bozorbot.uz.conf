# Bozorbot: one file of its own in /etc/nginx/sites-enabled; the Kigo files are not touched.
# Certificates: Let's Encrypt (certbot --webroot), renewed by certbot's own timer.
server {
    listen 80;
    listen [::]:80;
    server_name bozorbot.uz www.bozorbot.uz;
    location /.well-known/acme-challenge/ { root /var/www/bozorbot-acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bozorbot.uz;

    ssl_certificate /etc/letsencrypt/live/bozorbot.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bozorbot.uz/privkey.pem;

    client_max_body_size 15m;   # product photos

    location / {
        proxy_pass http://127.0.0.1:3700;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 75s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.bozorbot.uz;
    ssl_certificate /etc/letsencrypt/live/bozorbot.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bozorbot.uz/privkey.pem;
    return 301 https://bozorbot.uz$request_uri;
}
